<!DOCTYPE html>
<html>
<head>
    <title>Admin Registration | HeartQAML</title>
</head>

<body>

    <h1>Admin Registration</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Full Name</label><br>
        <input
            type="text"
            name="full_name"
            required
        >

        <br><br>

        <label>Email</label><br>
        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <label>Phone</label><br>
        <input
            type="text"
            name="phone"
        >

        <br><br>

        <label>Password</label><br>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <label>Confirm Password</label><br>
        <input
            type="password"
            name="confirm_password"
            required
        >

        <br><br>

        <button type="submit">
            Create Admin Account
        </button>

    </form>

    <p>
        Already registered?
        <a href="{{ url_for('admin_login') }}">
            Login
        </a>
    </p>

</body>
</html>
